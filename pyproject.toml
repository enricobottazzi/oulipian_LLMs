[project]
name = "oulipian-llms"
version = "0.1.0"
description = "Oulipian generation constraints as HuggingFace LogitsProcessors."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
]

[project.optional-dependencies]
test = ["pytest", "python-dotenv", "accelerate"]

[project.urls]
Homepage = "https://github.com/enricobottazzi/oulipian_LLMs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oulipian_llms"]
